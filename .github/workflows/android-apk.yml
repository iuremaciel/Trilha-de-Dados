name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Compilar aplicativo web
        run: npm run build

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar plataforma Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Verificar Gradle
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Erro: arquivo android/gradlew não encontrado."
            exit 1
          fi

      - name: Permitir execução do Gradle
        run: chmod +x android/gradlew

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: trilha-de-dados-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
